name: CI

on:
  push:
    branches:
      - main
      - mailsieve-boundary-scrub
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  identity:
    name: identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository identity
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f package.json
          test -f mailsieve.mjs
          python3 -c 'import json; d=json.load(open("package.json", encoding="utf-8")); assert d["name"]=="mailsieve"; assert d["private"] is True; desc=d.get("description",""); assert desc.strip(); assert "verifrax" not in desc.lower()'

  append-only:
    name: append-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block boundary residue and tracked runtime output
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI "verifrax|artifact-0005|AUCTORISEAL|CORPIFORM|SIGILLARIUM|proof\\.verifrax|verify\\.verifrax|apply\\.verifrax|cicullis\\.verifrax|docs\\.verifrax|status\\.verifrax" -- README.md package.json; then
            echo "Boundary residue detected"
            exit 1
          fi
          if git ls-files | grep -Eq "^(results\\.csv|processed\\.txt|logs/.*\\.jsonl)$"; then
            echo "Runtime output files must not be tracked"
            exit 1
          fi

  checksum-verify:
    name: checksum-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recompute stable checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum README.md package.json mailsieve.mjs .github/workflows/ci.yml > CHECKSUMS.txt
          test -s CHECKSUMS.txt
          cat CHECKSUMS.txt

  whitespace-check:
    name: whitespace-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject CRLF and trailing whitespace
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nI $'\r' -- .; then
            echo "CRLF detected"
            exit 1
          fi
          if git grep -nI -E "[[:blank:]]$" -- .; then
            echo "Trailing whitespace detected"
            exit 1
          fi
